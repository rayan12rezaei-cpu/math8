name: Build Madar Riazi APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install Cordova
        run: npm install --global cordova

      - name: Check input files
        run: |
          test -f index.html || {
            echo "ERROR: index.html not found in repository root"
            exit 1
          }
          test -f config.xml || {
            echo "ERROR: config.xml not found in repository root"
            exit 1
          }

      - name: Create Cordova project
        run: |
          cordova create /tmp/madar com.rayan.mr8 "مدار ریاضی"
          cp index.html /tmp/madar/www/index.html
          cp config.xml /tmp/madar/config.xml

      - name: Add Android platform
        working-directory: /tmp/madar
        run: cordova platform add android@15

      - name: Build Debug APK
        working-directory: /tmp/madar
        run: cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: madar-riazi-debug-apk
          path: /tmp/madar/platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
